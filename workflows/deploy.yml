# Builds the Shiny app with {shinylive} and publishes it to GitHub Pages.
# Uses the reusable workflow maintained by the shinylive authors:
# https://github.com/posit-dev/r-shinylive/tree/actions-v1/examples
name: Deploy app to GitHub Pages

on:
  # Run it by hand from the Actions tab
  workflow_dispatch:
  # Redeploy whenever main changes
  push:
    branches: ["main"]
  # Build (but do not deploy) on pull requests, to catch errors early
  pull_request:

jobs:
  shinylive:
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    permissions:
      contents: read   # check out the repo
      pages: write     # deploy to Pages
      id-token: write  # verify the deployment comes from this workflow
